<style>
/* Layout: one phone-first column with a bottom tab bar; drill-down lists (محافظة > مدينة > عميل); forms open as full-screen sheets. */
:root{
  color-scheme:light;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --bg:#F3F5FA; --surface:#FFFFFF; --surface2:#E9EDF6; --ink:#141B33; --muted:#5B6585; --line:#DAE0EE;
  --accent:#324C92; --accent-soft:#E2E8F7; --accent-ink:#FFFFFF;
  --accent2:#7A4A8A; --accent2-soft:#F0E5F4;
  --grad:linear-gradient(90deg,#1C448E,#324C92 55%,#966AA2);
  --ok:#177245; --ok-soft:#DCF2E4; --warn:#8F5200; --warn-soft:#FBEBCB; --bad:#B3261E; --bad-soft:#FADAD7;
  --shadow:0 1px 2px rgba(20,27,51,.06),0 6px 18px rgba(20,27,51,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1226; --surface:#151B34; --surface2:#1D2547; --ink:#E7EBF8; --muted:#99A4C8; --line:#2A3460;
  --accent:#9DB2F2; --accent-soft:#222C5A; --accent-ink:#0B1030;
  --accent2:#D0A8DC; --accent2-soft:#35254A;
  --grad:linear-gradient(90deg,#5E86E6,#9DB2F2 55%,#D0A8DC);
  --ok:#5FD08F; --ok-soft:#14382A; --warn:#F0B454; --warn-soft:#3E2E10; --bad:#FF8A80; --bad-soft:#431C19;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1226; --surface:#151B34; --surface2:#1D2547; --ink:#E7EBF8; --muted:#99A4C8; --line:#2A3460;
  --accent:#9DB2F2; --accent-soft:#222C5A; --accent-ink:#0B1030;
  --accent2:#D0A8DC; --accent2-soft:#35254A;
  --grad:linear-gradient(90deg,#5E86E6,#9DB2F2 55%,#D0A8DC);
  --ok:#5FD08F; --ok-soft:#14382A; --warn:#F0B454; --warn-soft:#3E2E10; --bad:#FF8A80; --bad-soft:#431C19;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600;color:var(--muted)}
.wrap{max-width:720px;margin:0 auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px}
.ltr{direction:ltr;unicode-bidi:plaintext;display:inline-block}
/* header */
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top .grow{flex:1;min-width:0}
.icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.icon svg{width:22px;height:22px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
/* cards & lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;min-width:0}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column}
.item .main b{font-weight:600;overflow-wrap:anywhere}
.item .side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;text-align:end}
.item.dim{opacity:.62}
.chev{width:18px;height:18px;flex:none;color:var(--muted);transform:scaleX(-1)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>.row{padding-inline:2px}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:start;cursor:default}
.tile b{font-size:24px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
button.tile{cursor:pointer}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px}
.seg button{flex:1;min-height:36px;border:0;background:transparent;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea.in{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.tiles .tile b{font-size:21px}}
.micwrap{position:relative}
.mic{position:absolute;inset-inline-end:8px;top:8px;width:40px;height:40px}
.mic.on{background:var(--bad);color:#fff;border-color:var(--bad)}
textarea.withmic{padding-inline-end:56px}
.partial{color:var(--muted);font-size:13px;min-height:20px}
/* nav */
#nav{position:fixed;inset:auto 0 0 0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
#nav .in-nav{max-width:720px;margin:0 auto;display:flex;gap:4px}
#nav button{flex:1;min-width:0;min-height:52px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer;position:relative}
#nav button.on{color:var(--accent);font-weight:700;background:var(--accent-soft)}
.badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-in{max-width:720px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sh-head{display:flex;align-items:center;gap:10px}
#toast{position:fixed;z-index:30;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
#toast span{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;max-width:90vw}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px}
.center{min-height:70vh;display:flex;align-items:center;justify-content:center}
.pick{max-height:280px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.grp{font-size:13px;font-weight:600;color:var(--muted);padding:8px 2px 2px}
.chk{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent);flex:none}
details.dt>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;min-height:32px;display:flex;align-items:center}
.done{text-decoration:line-through;color:var(--muted)}
.tiles.t4{grid-template-columns:repeat(2,1fr)}
.item.cmp{flex-direction:column;align-items:stretch;gap:6px}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th,.tb td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.tb th{color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:no-preference){.item,.btn,.chip{transition:background .15s,border-color .15s}}

.note.good{background:var(--ok-soft);color:var(--ok)}
.card.dim{opacity:.62}

.pill.pur{background:var(--accent2-soft);color:var(--accent2)}
.logo{display:block;width:auto;max-width:100%}
.logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none}
:root[data-theme="dark"] .logo-d{display:block}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <div class="wrap" id="view"></div>
  <nav id="nav" aria-label="التنقل"></nav>
  <div id="sheet" hidden></div>
  <div id="toast" hidden></div>
</div>
<noscript>لازم تفعّل JavaScript عشان النظام يشتغل.</noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script>
"use strict";
/* ---------- constants ---------- */
var GOVS=["القاهرة","الجيزة","الإسكندرية","القليوبية","الشرقية","الدقهلية","الغربية","المنوفية","البحيرة","كفر الشيخ","دمياط","بورسعيد","الإسماعيلية","السويس","شمال سيناء","جنوب سيناء","الفيوم","بني سويف","المنيا","أسيوط","سوهاج","قنا","الأقصر","أسوان","البحر الأحمر","الوادي الجديد","مطروح"];
var ROLES={rep:{n:"Medical Rep",r:1},dm:{n:"District Manager",r:2},am:{n:"Area Manager",r:3},lm:{n:"Line Manager",r:4},bu:{n:"Business Unit",r:5}};
var TYPES={doctor:{n:"دكتور",pl:"الدكاترة",d:"التخصص"},hospital:{n:"مستشفى",pl:"المستشفيات",d:"القسم / ملاحظات"},pharmacy:{n:"صيدلية",pl:"الصيدليات",d:"اسم الصيدلي"}};
var PERIODS={daily:"يومية",weekly:"أسبوعية",monthly:"شهرية"};
var STATUS={draft:["مسودة",""],pending:["في انتظار الاعتماد","warn"],approved:["معتمدة","ok"],rejected:["مرفوضة","bad"]};
var OUTCOMES=["ممتاز","جيد","عادي","ضعيف"];
var SPECS=["باطنة","أطفال","نساء وتوليد","عظام","جلدية","قلب","أنف وأذن","عيون","مسالك بولية","مخ وأعصاب","أسنان","صدر","سكر وغدد","جراحة عامة","تغذية"];
var IC={
 home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
 users:'<path d="M16 20v-1a4 4 0 00-4-4H7a4 4 0 00-4 4v1M9.5 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM21 20v-1a4 4 0 00-3-3.9M16 4.1a3.5 3.5 0 010 6.8"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 team:'<rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/>',
 more:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 back:'<path d="M9 6l6 6-6 6"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',
 check:'<path d="M5 12l5 5 9-10"/>'
};
function ic(n,cls){return '<svg class="i '+(cls||'')+'" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}

/* ---------- helpers ---------- */
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return ymd(new Date())}
function addDays(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d)}
function monthRange(s){var p=s.split("-").map(Number);return [p[0]+"-"+pad(p[1])+"-01",ymd(new Date(p[0],p[1],0))]}
function rangeFor(period,start){
  if(period==="daily")return [start,start];
  if(period==="weekly")return [start,addDays(start,6)];
  return monthRange(start);
}
function fmtD(s){return new Date(s+"T12:00:00").toLocaleDateString("ar-EG-u-nu-latn",{day:"numeric",month:"short"})}
function fmtLong(){return new Date().toLocaleDateString("ar-EG-u-nu-latn",{weekday:"long",day:"numeric",month:"long"})}
function fmtT(iso){try{return new Date(iso).toLocaleTimeString("ar-EG-u-nu-latn",{hour:"numeric",minute:"2-digit"})}catch(e){return ""}}
function rangeTxt(p){return p.start===p.end?fmtD(p.start):fmtD(p.start)+" – "+fmtD(p.end)}
function pill(t,c){return '<span class="pill '+(c||"")+'">'+esc(t)+'</span>'}
function ar(s){return String(s||"").toLowerCase()}

/* ---------- state ---------- */
var sb=null,uid=null,authEmail="",priv=false,dict=null;
var store={users:[],cities:[],clients:[],visits:[],plans:[],products:[]};
var ready={};
var S={tab:"home",nav:{gov:null,cityId:null,clientId:null},q:"",ctype:"all",pfilter:"all",teamStack:[],fatal:"",slow:false,loadErr:false,authReady:false,auth:{mode:"login"},recovery:false,skipMgr:false,starting:false,joinCode:"",rt:null,installEvt:null,olderLoaded:{},rp:{range:"month",from:"",to:"",gov:"",days:30,all:false}};
var VF=null,PF=null,dictTarget=null;
function U(id){return store.users.find(function(u){return u.id===id})}
function meU(){return U(uid)}
function rank(u){return u&&ROLES[u.role]?ROLES[u.role].r:1}
function isBU(){var m=meU();return !!m&&m.role==="bu"}
function kids(id){
  var me=meU();
  return store.users.filter(function(u){
    if(!u.active||u.id===id)return false;
    if(u.managerId===id)return true;
    return id===uid&&!!me&&me.role==="bu"&&!u.managerId&&u.role!=="bu";
  });
}
function desc(id){
  var me=meU();
  if(id===uid&&me&&me.role==="bu")return store.users.filter(function(u){return u.id!==uid}).map(function(u){return u.id});
  var out=[],seen={},q=[id];seen[id]=1;
  while(q.length){var c=q.shift();store.users.forEach(function(k){if(k.managerId===c&&!seen[k.id]){seen[k.id]=1;out.push(k.id);q.push(k.id)}})}
  return out;
}
function isAnc(a,b){
  if(a===b)return false;
  var ua=U(a);
  if(ua&&ua.role==="bu")return !!U(b);
  var c=(U(b)||{}).managerId,n=0;while(c&&n++<12){if(c===a)return true;c=(U(c)||{}).managerId}return false;
}
function scopeIds(){return [uid].concat(desc(uid))}
function visClients(){var s=new Set(scopeIds());return store.clients.filter(function(c){return s.has(c.ownerId)})}
function cityName(id){var c=store.cities.find(function(x){return x.id===id});return c?c.name:""}
function clientById(id){return store.clients.find(function(c){return c.id===id})}
function nameOf(id){var u=U(id);return u?u.name:"مستخدم محذوف"}
function lastVisitMap(){var m={};store.visits.forEach(function(v){if(!m[v.clientId]||v.date>m[v.clientId])m[v.clientId]=v.date});return m}
function pathOf(c){return [c.gov,cityName(c.cityId)].filter(Boolean).join(" › ")}
function pendingForMe(){return store.plans.filter(function(p){return p.status==="pending"&&isAnc(uid,p.ownerId)})}
function planProg(p){
  var seen=new Set(store.visits.filter(function(v){return v.repId===p.ownerId&&v.date>=p.start&&v.date<=p.end}).map(function(v){return v.clientId}));
  var items=p.items||[];var done=items.filter(function(i){return seen.has(i)});
  return {done:done.length,total:items.length,seen:seen};
}
function toast(msg){var t=$("#toast");t.innerHTML="<span>"+esc(msg)+"</span>";t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2600)}
/* ---------- errors & db helpers ---------- */
var NETRE=/failed to fetch|networkerror|network request failed|load failed|fetch failed|network error/i;
function isNet(e){return !!e&&(NETRE.test(String(e.message||e))||e.status===0)}
function errMsg(e){
  var m=String((e&&(e.message||e.error_description))||""),c=e&&e.code;
  if(isNet(e)||!navigator.onLine)return "مفيش نت. العملية دي محتاجة اتصال.";
  if(/plan_locked/.test(m))return "الخطة مقفولة ومينفعش تتعدل.";
  if(/bad_manager/.test(m))return "المدير لازم تكون درجته أعلى من الموظف.";
  if(/bad_role/.test(m))return "في موظفين تحته درجتهم مش أقل من الوظيفة دي.";
  if(/cannot_change_self/.test(m))return "مينفعش تغير وظيفتك أو توقف حسابك بنفسك.";
  if(/not_allowed|row-level security/.test(m)||c==="42501")return "مفيش صلاحية للعملية دي.";
  if(c==="23505")return "ده موجود قبل كده.";
  if(c==="23503")return "مينفعش، لسه مرتبط ببيانات تانية.";
  return "حصلت مشكلة. جرّب تاني.";
}
async function db(op,ok){
  try{var r=await op();if(r&&r.error)throw r.error;if(ok)toast(ok);return r||true}
  catch(e){toast(errMsg(e));return false}

var WIN_DAYS=130,BASEV=[],BASEP=[],EXV=[],EXP=[],OLDV={},LOADED_FROM=null;
function cut(){return addDays(today(),-WIN_DAYS)}
function uniq(list){var s={},o=[];list.forEach(function(x){if(!s[x.id]){s[x.id]=1;o.push(x)}});return o}
function newId(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==="x"?r:(r&3|8)).toString(16)});
}
async function fetchPaged(table,mod){
  var out=[],from=0;
  for(;;){
    var q=sb.from(table).select("*");
    if(mod)q=mod(q);
    var r=await q.order("id").range(from,from+999);
    if(r.error)throw r.error;
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<1000)break;
    from+=1000;
  }
  return out;
}
/* offline queue: visits are written here first, then uploaded */
function qGet(){try{return JSON.parse(localStorage.getItem("zieno_q:"+uid)||"[]")}catch(e){return []}}
function qSet(a){try{localStorage.setItem("zieno_q:"+uid,JSON.stringify(a))}catch(e){}}
function composeVisits(base){
  var all=base.concat(EXV);
  Object.keys(OLDV).forEach(function(k){all=all.concat(OLDV[k])});
  all=uniq(all);
  var seen={};all.forEach(function(v){seen[v.id]=1});
  var q=qGet().filter(function(v){return !seen[v.id]}).map(function(v){var o=Object.assign({},v);o.pending=true;return o});
  return all.concat(q);
}
async function loadTable(name){
  var t=TBL[name],rows;
  if(name==="visits"){
    rows=await fetchPaged(t,function(q){return q.gte("visit_date",cut())});
    BASEV=rows.map(MAP.visits);store.visits=composeVisits(BASEV);return;
  }
  if(name==="plans"){
    rows=await fetchPaged(t,function(q){return q.gte("end_date",cut())});
    BASEP=rows.map(MAP.plans);store.plans=uniq(BASEP.concat(EXP));return;
  }
  rows=await fetchPaged(t);
  store[name]=rows.map(MAP[name]);
}
async function loadTables(){
  var names=Array.prototype.slice.call(arguments);
  await Promise.all(names.map(function(n){return loadTable(n)}));
  cacheSave();sched();
}
async function loadAll(){
  await Promise.all(["users","cities","clients","visits","plans","products"].map(loadTable));
  if(isBU()){
    try{var r=await sb.from("app_settings").select("value").eq("key","join_code").maybeSingle();S.joinCode=(r.data&&r.data.value)||""}catch(e){}
  }

}
function cacheSave(){
  if(!uid||!ready.users)return;
  try{localStorage.setItem("zieno_cache:"+uid,JSON.stringify({at:Date.now(),email:authEmail,s:{users:store.users,cities:store.cities,clients:store.clients,visits:BASEV,plans:BASEP,products:store.products}}))}
  catch(e){try{localStorage.removeItem("zieno_cache:"+uid)}catch(_){}}
}
function cacheLoad(u){
  try{
    var c=JSON.parse(localStorage.getItem("zieno_cache:"+u)||"null");
    if(!c||!c.s)return false;
    store.users=c.s.users||[];store.cities=c.s.cities||[];store.clients=c.s.clients||[];store.products=c.s.products||[];
    BASEV=c.s.visits||[];BASEP=c.s.plans||[];store.visits=composeVisits(BASEV);store.plans=BASEP.slice();
    authEmail=c.email||authEmail;ready.users=true;return true;
  }catch(e){return false}
}
function resetState(){
  if(S.rt&&sb){try{sb.removeChannel(S.rt)}catch(e){}}
  uid=null;authEmail="";ready={};
  store={users:[],cities:[],clients:[],visits:[],plans:[],products:[]};
  BASEV=[];BASEP=[];EXV=[];EXP=[];OLDV={};LOADED_FROM=null;
  S.joinCode="";S.tab="home";S.nav={gov:null,cityId:null,clientId:null};S.teamStack=[];S.rt=null;
  S.starting=false;S.skipMgr=false;S.loadErr=false;S.slow=false;S.olderLoaded={};S.auth={mode:"login"};
}
function subscribeRT(){
  if(!sb)return;
  if(S.rt){try{sb.removeChannel(S.rt)}catch(e){}}
  try{
    var ch=sb.channel("crm-changes"),timers={};
    Object.keys(TBL).forEach(function(k){
      ch.on("postgres_changes",{event:"*",schema:"public",table:TBL[k]},function(){
        clearTimeout(timers[k]);
        timers[k]=setTimeout(function(){loadTables(k).catch(function(){})},700);
      });
    });
    ch.subscribe();S.rt=ch;
  }catch(e){S.rt=null}
}
async function ensureRange(from){
  var lf=LOADED_FROM||cut();
  if(!from||from>=lf)return;
  try{
    var vr=await fetchPaged("visits",function(q){return q.gte("visit_date",from).lt("visit_date",lf)});
    var pr=await fetchPaged("plans",function(q){return q.gte("end_date",from).lt("end_date",lf)});
    EXV=EXV.concat(vr.map(MAP.visits));EXP=EXP.concat(pr.map(MAP.plans));LOADED_FROM=from;
    store.visits=composeVisits(BASEV);store.plans=uniq(BASEP.concat(EXP));
  }catch(e){toast(errMsg(e))}
}
async function loadOlder(id){
  try{
    var rows=await fetchPaged("visits",function(q){return q.eq("client_id",id).lt("visit_date",cut())});
    OLDV[id]=rows.map(MAP.visits);S.olderLoaded[id]=true;store.visits=composeVisits(BASEV);render();
  }catch(e){toast(errMsg(e))}
}
function toVisitDb(v){
  return {id:v.id,rep_id:uid,client_id:v.clientId,visit_date:v.date,visited_at:v.at,outcome:v.outcome||"",products:v.products||[],notes:v.notes||"",followup:v.followup||"",followup_date:v.followupDate||null};
}
var flushing=false;
async function flushQueue(){
  if(flushing||!sb||!uid||!navigator.onLine)return;
  if(!qGet().length)return;
  flushing=true;
  var sent=0,drop=0,done={};
  try{
    for(;;){
      var q=qGet().filter(function(x){return !done[x.id]});
      if(!q.length)break;
      var it=q[0],r;
      try{r=await sb.from("visits").upsert(toVisitDb(it),{onConflict:"id",ignoreDuplicates:true})}catch(e){break}
      if(r.error){if(isNet(r.error))break;drop++;done[it.id]=1;continue}
      sent++;done[it.id]=1;
    }
  }finally{
    qSet(qGet().filter(function(x){return !done[x.id]}));
    flushing=false;
  }
  if(sent||drop){
    try{await loadTables("visits")}catch(e){store.visits=composeVisits(BASEV);sched()}
    if(sent)toast(sent===1?"تم حفظ الزيارة":"اترفعت "+sent+" زيارة");
    if(drop)toast(drop+" زيارة اترفضت (العميل اتحذف أو مفيش صلاحية)");
  }
}

/* ---------- auth ---------- */
function authErr(e){
  var m=String((e&&e.message)||"");
  if(isNet(e)||!navigator.onLine)return "مفيش نت. اتصل بالإنترنت وجرّب تاني.";
  if(/invalid login/i.test(m))return "الإيميل أو الباسوورد غلط.";
  if(/not confirmed/i.test(m))return "لازم تأكد الإيميل الأول من الرسالة اللي وصلتلك.";
  if(/already registered|already been registered/i.test(m))return "الإيميل ده مسجل قبل كده. سجّل دخول.";
  if(/database error saving new user|invalid_join_code/i.test(m))return "كود الانضمام غلط. اطلبه من الـ Business Unit.";
  if(/password/i.test(m)&&/(least|short|weak|characters)/i.test(m))return "الباسوورد لازم يكون 6 حروف على الأقل.";
  if(/rate limit|too many/i.test(m)||(e&&e.status===429))return "محاولات كتيرة. استنى شوية وجرّب تاني.";
  if(/valid email|invalid.*email|unable to validate email/i.test(m))return "الإيميل مش مظبوط.";
  return "حصلت مشكلة. جرّب تاني.";
}

async function startSession(user){
  if(S.starting)return;
  if(uid===user.id&&ready.users&&!S.loadErr)return;
  S.starting=true;S.loadErr=false;S.slow=false;
  uid=user.id;authEmail=user.email||authEmail;

  try{await loadAll()}

function onAuth(ev,session){
  if(ev==="PASSWORD_RECOVERY"){S.recovery=true;S.authReady=true;render();return}
  if(ev==="SIGNED_OUT"){resetState();S.authReady=true;render();return}
  if(session&&session.user){S.authReady=true;startSession(session.user);return}
  if(ev==="INITIAL_SESSION"){S.authReady=true;if(!offlineBoot())render()}
}

function stats(ids,from,to,gov){
  var set=new Set(ids);
  var v=store.visits.filter(function(x){return set.has(x.repId)&&x.date>=from&&x.date<=to});
  var cl=store.clients.filter(function(c){return set.has(c.ownerId)});
  if(gov){
    v=v.filter(function(x){var c=clientById(x.clientId);return c&&c.gov===gov});
    cl=cl.filter(function(c){return c.gov===gov});
  }
  var seen=new Set(v.map(function(x){return x.clientId}));
  var cov=cl.filter(function(c){return seen.has(c.id)});
  var a=cl.filter(function(c){return c.cls==="A"});
  var aCov=a.filter(function(c){return seen.has(c.id)});
  return {visits:v.length,clients:cl.length,covered:cov.length,cov:cl.length?Math.round(100*cov.length/cl.length):0,a:a.length,aCov:aCov.length,freq:cov.length?Math.round(10*v.length/cov.length)/10:0};
}
function adherence(ids,from,to,gov){
  var set=new Set(ids),done=0,total=0;
  store.plans.forEach(function(p){
    if(p.status!=="approved"||!set.has(p.ownerId)||p.end<from||p.start>to)return;
    var pr=planProg(p);
    (p.items||[]).forEach(function(i){
      var c=clientById(i);
      if(!c||(gov&&c.gov!==gov))return;
      total++;if(pr.seen.has(i))done++;
    });
  });
  return {done:done,total:total,pct:total?Math.round(100*done/total):null};
}
function repRange(){
  var r=S.rp,t=today(),d=new Date();
  if(r.range==="today")return [t,t,"اليوم"];
  if(r.range==="week"){var diff=(d.getDay()+1)%7;return [addDays(t,-diff),t,"الأسبوع الحالي (من السبت)"]}
  if(r.range==="last"){var m=monthRange(ymd(new Date(d.getFullYear(),d.getMonth()-1,1)));return [m[0],m[1],"الشهر اللي فات"]}
  if(r.range==="custom"){var f=r.from||addDays(t,-6),e=r.to||t;if(f>e){var x=f;f=e;e=x}return [f,e,"فترة مخصصة"]}
  return [monthRange(t.slice(0,7)+"-01")[0],t,"الشهر الحالي"];
}
function trendHtml(ids,from,to,gov){
  var days=[],d=to,n=0;
  while(d>=from&&n<62){days.unshift(d);d=addDays(d,-1);n++}
  if(days.length<2)return "";
  var set=new Set(ids),cnt={};
  store.visits.forEach(function(v){
    if(!set.has(v.repId)||v.date<days[0]||v.date>to)return;
    if(gov){var c=clientById(v.clientId);if(!c||c.gov!==gov)return}
    cnt[v.date]=(cnt[v.date]||0)+1;
  });
  var max=Math.max.apply(null,days.map(function(x){return cnt[x]||0}));
  if(!max)return "";
  var cols=days.map(function(x){
    var c=cnt[x]||0;
    return '<div title="'+fmtD(x)+': '+c+'" style="flex:1;min-width:2px;height:'+Math.max(3,Math.round(100*c/max))+'%;background:var(--accent);border-radius:3px 3px 0 0;opacity:'+(c?1:.25)+'"></div>';
  }).join("");
  return '<div class="card"><div class="row sb"><span class="lbl">الزيارات يوم بيوم</span><span class="sub num">أعلى يوم: '+max+'</span></div><div style="display:flex;align-items:flex-end;gap:2px;height:96px;border-bottom:1px solid var(--line)">'+cols+'</div><div class="row sb sub num"><span>'+fmtD(days[0])+'</span><span>'+fmtD(days[days.length-1])+'</span></div></div>';
}

function render(){

  v.innerHTML=banner()+f();

function xlAnalyze(){
  var out=$("#xl-out"),raw=XL.raw||[],type=XL.type,hit=null,r;
  for(r=0;r<Math.min(6,raw.length)&&!hit;r++){
    var h=raw[r].map(nz),used=[],c={};
    c.name=findCol(h,XA.name[type],used);if(c.name<0)continue;used.push(c.name);
    ["city","address","phone","cls"].forEach(function(k){c[k]=findCol(h,XA[k],used);if(c[k]>-1)used.push(c[k])});
    c.detail=findCol(h,XA.detail[type],used);
    hit={hr:r,c:c};
  }
  if(!hit){XL.items=null;out.innerHTML='<div class="note">مالقيتش عمود الاسم. أول صف في الشيت لازم يبقى عناوين الأعمدة (الاسم، المدينة، العنوان، التليفون...). جرّب تغيّر نوع الشيت فوق أو حمّل النموذج.</div>';return}
  var cityMap={};store.cities.forEach(function(ct){if(ct.gov===XL.gov)cityMap[nz(ct.name)]=ct.id});
  var exist={};store.clients.forEach(function(cl){exist[cl.type+"|"+cl.cityId+"|"+nz(cl.name)]=1});
  var seen={},items=[],newC={},st={total:0,noName:0,noCity:0,dup:0,over:0};
  function g(row,k){var i=hit.c[k];return(i>-1&&row[i]!=null)?String(row[i]).trim():""}
  for(r=hit.hr+1;r<raw.length;r++){
    var row=raw[r];
    if(!row.some(function(x){return String(x).trim()}))continue;
    st.total++;
    var name=g(row,"name");if(!name){st.noName++;continue}
    var ctext=g(row,"city"),cid=null,ckey="";
    if(ctext){ckey=nz(ctext);cid=cityMap[ckey]||null;if(!cid&&!newC[ckey])newC[ckey]=ctext}
    else if(XL.defCityId){cid=XL.defCityId}
    else{st.noCity++;continue}
    var dk=type+"|"+(cid||("new:"+ckey))+"|"+nz(name);
    if((cid&&exist[type+"|"+cid+"|"+nz(name)])||seen[dk]){st.dup++;continue}
    seen[dk]=1;
    var ph=g(row,"phone").replace(/[^\d+]/g,"");if(/^1\d{9}$/.test(ph))ph="0"+ph;
    var cl=g(row,"cls").toUpperCase().charAt(0);if(!cl||"ABC".indexOf(cl)<0)cl="B";
    items.push({name:name,cid:cid,ckey:ckey,detail:g(row,"detail"),address:g(row,"address"),phone:ph,cls:cl});
  }
  if(items.length>500){st.over=items.length-500;items=items.slice(0,500)}
  var used2={};items.forEach(function(it){if(!it.cid)used2[it.ckey]=1});
  Object.keys(newC).forEach(function(k){if(!used2[k])delete newC[k]});
  XL.items=items;XL.newC=newC;
  var nc=Object.keys(newC);
  var sum=st.total+" صف في الشيت"+(st.dup?" · "+st.dup+" مكرر هيتخطى":"")+(st.noName?" · "+st.noName+" من غير اسم":"")+(st.noCity?" · "+st.noCity+" من غير مدينة":"")+(st.over?" · "+st.over+" زيادة عن الحد (500 في المرة)":"");
  if(!items.length){out.innerHTML='<div class="note">مفيش صفوف تنفع تتسجل. '+esc(sum)+'.</div>';return}
  var rows=items.slice(0,6).map(function(it){return '<tr><td>'+esc(it.name)+'</td><td>'+esc(it.cid?cityName(it.cid):newC[it.ckey])+'</td><td>'+esc(it.address)+'</td></tr>'}).join("");
  out.innerHTML='<div class="card"><div class="row sb"><b>جاهز للاستيراد</b>'+pill(items.length+" عميل","ok")+'</div><div class="sub num">'+esc(sum)+'</div>'+
    (nc.length?'<div class="lbl">مدن جديدة هتتضاف في '+esc(XL.gov)+'</div><div class="chips">'+nc.map(function(k){return pill(newC[k],"acc")}).join("")+'</div>':'')+
    '<div style="overflow-x:auto"><table class="tb"><tr><th>الاسم</th><th>المدينة</th><th>العنوان</th></tr>'+rows+'</table></div>'+
    (items.length>6?'<div class="sub">وغيرهم '+(items.length-6)+' صف.</div>':'')+
    '<button class="btn primary block" id="xl-go" data-act="xlRun">استيراد '+items.length+' عميل</button><div class="sub" id="xl-prog"></div></div>';
}

/* ---------- dictation (browser speech recognition) & downloads ---------- */
function makeDict(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  var rec=null,want=false,fin=[],part=[],st=[];
  function emit(a,x){a.forEach(function(f){try{f(x)}catch(e){}})}
  function begin(){
    rec=new SR();rec.lang="ar-EG";rec.continuous=false;rec.interimResults=true;
    rec.onresult=function(e){
      var interim="";
      for(var i=e.resultIndex;i<e.results.length;i++){
        var r=e.results[i];
        if(r.isFinal)emit(fin,{text:" "+r[0].transcript.trim()});else interim+=r[0].transcript;
      }
      emit(part,{text:interim});
    };
    rec.onerror=function(e){
      var c=e&&e.error;
      if(c==="not-allowed"||c==="service-not-allowed"){want=false;toast("الميكروفون مش مسموح. اكتب الملاحظات بإيدك.")}
      else if(c==="network"){want=false;toast("الإملاء الصوتي محتاج نت.")}
    };
    rec.onend=function(){
      emit(part,{text:""});
      if(want){setTimeout(function(){if(want){try{begin()}catch(e){want=false;emit(st,{state:"idle"})}}},150)}
      else emit(st,{state:"idle"});
    };
    rec.start();
  }
  return {
    active:function(){return want},
    start:function(){return new Promise(function(res,rej){
      if(want){res();return}
      want=true;
      try{begin();emit(st,{state:"listening"});res()}catch(e){want=false;rej({code:"upstream_error"})}
    })},
    stop:function(){want=false;try{if(rec)rec.stop()}catch(e){}return Promise.resolve()},
    onFinal:function(f){fin.push(f)},onPartial:function(f){part.push(f)},onState:function(f){st.push(f)}
  };
}
function initDict(){
  if(!dict)return;
  dict.onFinal(function(e){var t=dictTarget&&document.getElementById(dictTarget);if(!t)return;var x=e.text;if(!t.value.trim())x=x.replace(/^\s+/,"");t.value+=x;var p=$("#vf-partial");if(p)p.textContent=""});
  dict.onPartial(function(e){var p=$("#vf-partial");if(p)p.textContent=e.text||""});
  dict.onState(function(e){var b=document.querySelector(".mic");if(b)b.classList.toggle("on",e.state!=="idle")});
}
function makeDl(){
  return {save:function(o){return new Promise(function(res,rej){
    try{
      var type=/\.xlsx$/i.test(o.filename)?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"application/octet-stream";
      var url=URL.createObjectURL(new Blob([o.data],{type:type}));
      var a=document.createElement("a");a.href=url;a.download=o.filename;a.style.display="none";
      document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(url);a.remove()},4000);
      res({status:"saved"});
    }catch(e){rej({code:"unavailable"})}
  })}};
}

async function doAuth(kind){
  var email=((document.getElementById("au-email")||{}).value||"").trim();
  var pwEl=document.getElementById("au-pw"),pw=pwEl?pwEl.value:"";
  authMsg("");
  if(kind==="recovery"){
    if(pw.length<6){authMsg("الباسوورد لازم يكون 6 حروف على الأقل");return}
    authBusy(true);
    var rr=await sb.auth.updateUser({password:pw}).catch(function(e){return {error:e}});
    authBusy(false);
    if(rr.error){authMsg(authErr(rr.error));return}
    S.recovery=false;toast("تم تغيير الباسوورد");
    var s=await sb.auth.getSession();
    if(s&&s.data&&s.data.session)startSession(s.data.session.user);else render();
    return;
  }
  if(!email){authMsg("اكتب الإيميل");return}
  if(kind==="forgot"){
    authBusy(true);
    var fr=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}).catch(function(e){return {error:e}});
    authBusy(false);
    if(fr.error){authMsg(authErr(fr.error));return}
    authMsg("لو الإيميل مسجل هيوصلك رابط خلال دقايق. تأكد من الـ Spam كمان.",true);return;
  }
  if(pw.length<6){authMsg(pw?"الباسوورد لازم يكون 6 حروف على الأقل":"اكتب الباسوورد");return}
  authBusy(true);
  if(kind==="login"){
    var lr=await sb.auth.signInWithPassword({email:email,password:pw}).catch(function(e){return {error:e}});
    authBusy(false);
    if(lr.error)authMsg(authErr(lr.error));
    return;
  }
  var name=((document.getElementById("au-name")||{}).value||"").trim();
  if(!name){authBusy(false);authMsg("اكتب اسمك");return}
  var role=(document.getElementById("au-role")||{}).value||"rep";
  var code=((document.getElementById("au-code")||{}).value||"").trim().toUpperCase();
  var sr=await sb.auth.signUp({email:email,password:pw,options:{data:{name:name,role:role,join_code:code},emailRedirectTo:location.origin+location.pathname}}).catch(function(e){return {error:e}});
  authBusy(false);
  if(sr.error){authMsg(authErr(sr.error));return}
  if(!(sr.data&&sr.data.session))authMsg("تم إنشاء الحساب. افتح الإيميل وأكد الحساب، وبعدها سجّل دخول.",true);
}

});

function onInput(e){

  else if(k==="pfq"){var q=ar(t.value.trim());Array.prototype.forEach.call(document.querySelectorAll("#pf-list .chk"),function(x){x.hidden=q&&x.dataset.s.indexOf(q)<0})}
}

  if(!t.dataset||!t.dataset.in)return;
  var k=t.dataset.in;
  if(k==="uRole"){var u=U(t.dataset.id);var up={role:t.value};var m=u&&u.managerId&&U(u.managerId);if(m&&rank(m)<=ROLES[t.value].r)up.manager_id=null;dbw("users",function(){return sb.from("profiles").update(up).eq("id",t.dataset.id)},"تم تغيير الوظيفة").then(function(ok){if(!ok)render()})}
  else if(k==="uMgr")dbw("users",function(){return sb.from("profiles").update({manager_id:t.value||null}).eq("id",t.dataset.id)},"تم تغيير المدير").then(function(ok){if(!ok)render()});
});

function boot(){
  render();
  if(!window.supabase||!CFG.url||!CFG.key){
    S.fatal="الموقع مش جاهز: مكتبة Supabase ماتحملتش أو ملف config.js ناقص. اتأكد من النت وافتح الصفحة تاني.";
    render();return;
  }
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  dict=makeDict();dl=makeDl();initDict();
  sb.auth.onAuthStateChange(function(ev,session){setTimeout(function(){onAuth(ev,session)},0)});
  setTimeout(function(){if(!S.authReady){S.authReady=true;if(!offlineBoot())render()}},5000);
  window.addEventListener("online",function(){
    flushQueue();
    if(uid&&ready.users){loadAll().then(function(){sched()}).catch(function(){})}
    render();
  });
  window.addEventListener("offline",function(){render()});
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")flushQueue()});
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();S.installEvt=e;sched()});
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
    window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})});
  }
}
